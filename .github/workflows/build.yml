name: Build

on:
  push:
    branches: ['main']
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['main']
    paths-ignore: ['*.md']

permissions: {}

concurrency:
  group: package-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.

  initialization:
    name: First-install configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Read initialized configuration through the real SDK
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs/promises')
          const assert = require('node:assert/strict')
          const ts = require('typescript')
          require.extensions['.ts'] = (module, filename) => {
            const source = require('node:fs').readFileSync(filename, 'utf8')
            module._compile(ts.transpileModule(source, {compilerOptions: {
              module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022,
              esModuleInterop: true,
            }}).outputText, filename)
          }
          async function check() {
            const {sdk} = require(process.cwd() + '/startos/sdk.ts')
            const {preparePrivateFiles} = require(process.cwd() + '/startos/utils.ts')
            const root = await fs.mkdtemp('/tmp/atoll-init-')
            sdk.volumes.main.path = root
            const {configuration, alertConfiguration, remotes} = require(process.cwd() + '/startos/fileModels/config.ts')
            try {
              await preparePrivateFiles()
              assert.equal((await configuration.read().once()).source, '')
              assert.equal((await alertConfiguration.read().once()).enabled, false)
              assert.equal((await remotes.read().once()).r2.endpoint, '')
              for (const name of ['copy.json', 'alerts.json', 'setup.json']) {
                const path = root + '/private/' + name
                assert.equal((await fs.stat(path)).mode & 0o777, 0o600)
                await fs.writeFile(path, '')
              }
              await preparePrivateFiles()
              assert.equal((await configuration.read().once()).source, '')
              assert.equal((await alertConfiguration.read().once()).generation, '')
              const path = root + '/private/copy.json'
              const saved = '{"source":"r2:fixture/escrow","unknown":"preserve"}\n'
              await fs.writeFile(path, saved)
              await preparePrivateFiles()
              assert.equal(await fs.readFile(path, 'utf8'), saved)
              assert.equal((await configuration.read().once()).source, 'r2:fixture/escrow')
              await fs.writeFile(path, '{broken')
              await preparePrivateFiles()
              assert.equal(await fs.readFile(path, 'utf8'), '{broken')
              await assert.rejects(configuration.read().once(), SyntaxError)
              const utils = require(process.cwd() + '/startos/utils.ts')
              sdk.getRootCa = async () => 'FIXTURE-STARTOS-ROOT'
              let bundle = ''
              sdk.SubContainer.withTemp = async (_effects, _image, _mounts, _name, fn) => fn({
                exec: async (command, options) => {
                  if (command.includes('-c')) return {exitCode: 0, stdout: Buffer.from('FIXTURE-PUBLIC-ROOTS')}
                  assert.equal(options.env.SSL_CERT_FILE, utils.trustEnvironment.SSL_CERT_FILE)
                  assert.equal(options.timeout, 120000)
                  return {exitCode: 0, stdout: Buffer.from('{"pending":true}')}
                },
                writeFile: async (_path, data) => { bundle = data },
              })
              assert.deepEqual(await utils.connectionRequest({}, 'nextcloud-start', {}), {pending: true})
              assert.equal(bundle, 'FIXTURE-PUBLIC-ROOTS\nFIXTURE-STARTOS-ROOT')
              const {connectNtfy} = require(process.cwd() + '/startos/actions/connectNtfy.ts')
              sdk.host.get = (_effects, where) => {
                assert.deepEqual(where, {packageId: 'ntfy', hostId: 'ui-multi'})
                return {once: async () => 'https://ntfy.invalid'}
              }
              let grants = 0
              sdk.action.clearTask = async () => null
              sdk.action.run = async options => {
                grants++
                assert.equal(options.packageId, 'ntfy')
                assert.equal(options.actionId, 'provision-publisher')
                assert.deepEqual(options.input({}), {packageId: 'atoll-recovery', topic: 'atoll-recovery-health'})
                return {version: '1', result: {type: 'group', value: [{type: 'single', name: 'localized', masked: true, value: 'tk_fixture'}]}}
              }
              const result = await connectNtfy.run({effects: {}, input: {}})
              assert.equal(JSON.stringify(result).includes('tk_fixture'), false)
              const route = await alertConfiguration.read().once()
              assert.equal(route.provider, 'ntfy')
              assert.equal(route.token, 'tk_fixture')
              assert.equal(route.topic, 'atoll-recovery-health')
              await connectNtfy.run({effects: {}, input: {}})
              assert.equal(grants, 1)
              assert.notEqual((await alertConfiguration.read().once()).generation, route.generation)
              console.log('First-install SDK reads, private modes, retained configuration and helper trust environment passed.')
            } finally { await fs.rm(root, {recursive: true, force: true}) }
          }
          check().catch(error => { console.error(error); process.exitCode = 1 })
          JS
