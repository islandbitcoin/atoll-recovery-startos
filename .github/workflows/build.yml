name: Build

on:
  push:
    branches: ['main']
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['main']
    paths-ignore: ['*.md']

permissions: {}

concurrency:
  group: package-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.

  initialization:
    name: First-install configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Read initialized configuration through the real SDK
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs/promises')
          const assert = require('node:assert/strict')
          const ts = require('typescript')
          require.extensions['.ts'] = (module, filename) => {
            const source = require('node:fs').readFileSync(filename, 'utf8')
            module._compile(ts.transpileModule(source, {compilerOptions: {
              module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022,
              esModuleInterop: true,
            }}).outputText, filename)
          }
          async function check() {
            const {sdk} = require(process.cwd() + '/startos/sdk.ts')
            const root = await fs.mkdtemp('/tmp/atoll-init-')
            sdk.volumes.main.path = root
            const {preparePrivateFiles} = require(process.cwd() + '/startos/utils.ts')
            const {configuration, alertConfiguration, remotes} = require(process.cwd() + '/startos/fileModels/config.ts')
            try {
              await preparePrivateFiles()
              assert.equal((await configuration.read().once()).source, '')
              assert.equal((await alertConfiguration.read().once()).enabled, false)
              assert.equal((await remotes.read().once()).r2.endpoint, '')
              for (const name of ['copy.json', 'alerts.json', 'setup.json']) {
                const path = root + '/private/' + name
                assert.equal((await fs.stat(path)).mode & 0o777, 0o600)
                await fs.writeFile(path, '')
              }
              await preparePrivateFiles()
              assert.equal((await configuration.read().once()).source, '')
              assert.equal((await alertConfiguration.read().once()).generation, '')
              const path = root + '/private/copy.json'
              const saved = '{"source":"r2:fixture/escrow","unknown":"preserve"}\n'
              await fs.writeFile(path, saved)
              await preparePrivateFiles()
              assert.equal(await fs.readFile(path, 'utf8'), saved)
              assert.equal((await configuration.read().once()).source, 'r2:fixture/escrow')
              await fs.writeFile(path, '{broken')
              await preparePrivateFiles()
              assert.equal(await fs.readFile(path, 'utf8'), '{broken')
              await assert.rejects(configuration.read().once(), SyntaxError)
              const utils = require(process.cwd() + '/startos/utils.ts')
              sdk.getRootCa = async () => 'FIXTURE-STARTOS-ROOT'
              let bundle = ''
              sdk.SubContainer.withTemp = async (_effects, _image, _mounts, _name, fn) => fn({
                exec: async (command, options) => {
                  if (command.includes('-c')) return {exitCode: 0, stdout: Buffer.from('FIXTURE-PUBLIC-ROOTS')}
                  assert.equal(options.env.SSL_CERT_FILE, utils.trustEnvironment.SSL_CERT_FILE)
                  assert.equal(options.timeout, 120000)
                  return {exitCode: 0, stdout: Buffer.from('{"pending":true}')}
                },
                writeFile: async (_path, data) => { bundle = data },
              })
              assert.deepEqual(await utils.connectionRequest({}, 'nextcloud-start', {}), {pending: true})
              assert.equal(bundle, 'FIXTURE-PUBLIC-ROOTS\nFIXTURE-STARTOS-ROOT')
              const {connectNtfy} = require(process.cwd() + '/startos/actions/connectNtfy.ts')
              sdk.host.get = (_effects, where) => {
                assert.deepEqual(where, {packageId: 'ntfy', hostId: 'ui-multi'})
                return {once: async () => 'https://ntfy.invalid'}
              }
              let grants = 0
              sdk.action.clearTask = async () => null
              sdk.action.run = async options => {
                grants++
                assert.equal(options.packageId, 'ntfy')
                assert.equal(options.actionId, 'provision-publisher')
                assert.deepEqual(options.input({}), {packageId: 'atoll-recovery', topic: 'atoll-recovery-health'})
                return {version: '1', result: {type: 'group', value: [{type: 'single', name: 'localized', masked: true, value: 'tk_fixture'}]}}
              }
              const result = await connectNtfy.run({effects: {}, input: {}})
              assert.equal(JSON.stringify(result).includes('tk_fixture'), false)
              const route = await alertConfiguration.read().once()
              assert.equal(route.provider, 'ntfy')
              assert.equal(route.token, 'tk_fixture')
              assert.equal(route.topic, 'atoll-recovery-health')
              await connectNtfy.run({effects: {}, input: {}})
              assert.equal(grants, 1)
              assert.notEqual((await alertConfiguration.read().once()).generation, route.generation)
              await fs.writeFile(path, JSON.stringify({source_kind: 'r2', source: 'r2:fixture/escrow', unknown: 'preserve'}))
              assert.equal((await configuration.read().once()).attest_copies, false)
              const {configureCopyReceipts} = require(process.cwd() + '/startos/actions/configureCopyReceipts.ts')
              const receiptEffects = {eventId: 'copy-receipt-test'}
              await configureCopyReceipts.getInput({effects: receiptEffects})
              await assert.rejects(configureCopyReceipts.run({effects: receiptEffects, input: {enabled: true}}))
              await fs.writeFile(path, JSON.stringify({source_kind: 'issuer', issuer_id: '11111111-2222-4333-8444-555555555555', issuer_origin: 'https://issuer.invalid', issuer_secret: 'a'.repeat(43), source: 'issuer:11111111-2222-4333-8444-555555555555', unknown: 'preserve'}))
              const configured = await configureCopyReceipts.run({effects: receiptEffects, input: {enabled: true}})
              assert.equal((await configuration.read().once()).attest_copies, true)
              assert.equal((await configuration.read().once()).unknown, 'preserve')
              assert.equal(JSON.stringify(configured).includes('a'.repeat(43)), false)
              await configureCopyReceipts.run({effects: receiptEffects, input: {enabled: false}})
              assert.equal((await configuration.read().once()).attest_copies, false)
              // A lost additional-issuer claim must reuse its private device secret;
              // successful enrollment must not replace primary config or evidence.
              const {additionalIssuers} = require(process.cwd() + '/startos/fileModels/issuers.ts')
              const {connectAdditionalIssuer} = require(process.cwd() + '/startos/actions/connectAdditionalIssuer.ts')
              const additionalEffects = {eventId: 'additional-issuer-test'}
              await connectAdditionalIssuer.getInput({effects: additionalEffects})
              const primary = {...await configuration.read().once(), destination: 'nextcloud:staging'}
              await fs.writeFile(path, JSON.stringify(primary))
              await remotes.merge(receiptEffects, {nextcloud: {url: 'https://cloud.invalid/remote.php/dav/files/backup', user: 'backup', pass: 'obscured-fixture'}})
              const before = await fs.readFile(path, 'utf8')
              const evidence = JSON.stringify({version: 1, verified: {retained: true}, latest: {exported_at: 1}})
              await fs.writeFile(root + '/state/copy.json', evidence)
              const input = {name: 'Production', origin: 'https://production.invalid', code: 'b'.repeat(43), directory: 'production', receipts: true}
              let claims = []
              utils.connectionRequest = async (_effects, operation, request) => {
                assert.equal(operation, 'pair-issuer')
                claims.push(request.secret)
                if (claims.length === 1) throw new Error('fixture lost response')
                return {issuer_id: '22222222-2222-4222-8222-222222222222', connection_id: '33333333-3333-4333-8333-333333333333'}
              }
              await assert.rejects(connectAdditionalIssuer.run({effects: additionalEffects, input}))
              assert.equal((await additionalIssuers.read().once()).profiles.length, 0)
              const connected = await connectAdditionalIssuer.run({effects: additionalEffects, input})
              assert.equal(claims[0], claims[1])
              assert.equal(JSON.stringify(connected).includes(claims[1]), false)
              await assert.rejects(connectAdditionalIssuer.run({effects: additionalEffects, input: {...input, origin: 'https://other.invalid', directory: 'STAGING'}}))
              assert.equal(claims.length, 2)
              const profile = (await additionalIssuers.read().once()).profiles[0]
              assert.equal(profile.destination, 'nextcloud:production')
              assert.equal(profile.attest_copies, true)
              await utils.prepareIssuerFiles(profile, await alertConfiguration.read().once())
              const extraState = root + '/state/issuers/' + profile.id + '/copy.json'
              await fs.writeFile(extraState, evidence)
              await utils.prepareIssuerFiles({...profile, issuer_secret: 'c'.repeat(43)}, await alertConfiguration.read().once())
              assert.equal(await fs.readFile(extraState, 'utf8'), evidence)
              assert.equal(await fs.readFile(path, 'utf8'), before)
              assert.equal(await fs.readFile(root + '/state/copy.json', 'utf8'), evidence)
              await fs.unlink(root + '/state/copy.json')
              assert.equal(await utils.hasVerifiedEvidence(), true)
              await fs.writeFile(root + '/state/copy.json', evidence)
              // Exercise the real main composition while recording daemon declarations.
              // Separate paths and health IDs keep one issuer's receipts out of another.
              for (const model of [configuration, remotes, alertConfiguration, additionalIssuers]) {
                const read = model.read.bind(model)
                model.read = () => {const value = read(); return {once: () => value.once(), const: () => value.once()}}
              }
              const daemons = [], checks = []
              const chain = {addDaemon(id, options) {daemons.push({id, ...options}); return this},
                addHealthCheck(id, options) {checks.push({id, ...options}); return this}}
              sdk.setupMain = fn => fn
              sdk.Daemons.of = () => chain
              sdk.SubContainer.of = () => ({})
              utils.prepareTrust = async () => undefined
              const {main} = require(process.cwd() + '/startos/main.ts')
              await main({effects: receiptEffects})
              const copies = daemons.filter(item => item.exec.command.includes('/opt/cashu-copy/copy.py'))
              assert.equal(copies.length, 2)
              assert.equal(new Set(copies.map(item => item.exec.command.at(-1))).size, 2)
              assert.equal(new Set(checks.map(item => item.id)).size, checks.length)
              assert.equal(await fs.readFile(root + '/state/copy.json', 'utf8'), evidence)
              assert.equal(await fs.readFile(extraState, 'utf8'), evidence)
              await fs.writeFile(root + '/private/additional-issuers.json', '')
              await assert.rejects(utils.preparePrivateFiles())
              assert.equal(await fs.readFile(root + '/state/copy.json', 'utf8'), evidence)
              console.log('First-install, lost-claim recovery, immutable primary evidence and independent issuer daemon paths passed.')
            } finally { await fs.rm(root, {recursive: true, force: true}) }
          }
          check().catch(error => { console.error(error); process.exitCode = 1 })
          JS
